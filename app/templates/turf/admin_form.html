{% extends "base.html" %}
{% block title %}{% if turf_code %}Edit{% else %}New{% endif %} Turf Code{% endblock %}

{% block content %}
<div class="page-header">
  <h1>{% if turf_code %}Edit{% else %}New{% endif %} Turf Code</h1>
  <a href="{{ url_for('turf.index') }}" class="btn btn-outline btn-sm">Back to Codes</a>
</div>

<div class="card" style="max-width: 600px;">
  <form method="POST">
    <div class="form-group">
      <label for="city">City</label>
      <input type="text" name="city" id="city" value="{{ turf_code.city if turf_code else '' }}" required>
    </div>
    
    <div class="form-group">
      <label for="code">Code</label>
      <input type="text" name="code" id="code" value="{{ turf_code.code if turf_code else '' }}" required>
    </div>
    
    <div class="form-group">
      <label for="description">Description / Notes</label>
      <textarea name="description" id="description">{{ turf_code.description if turf_code else '' }}</textarea>
    </div>
    
    <button type="submit" class="btn btn-primary">Save Turf Code</button>
  </form>
</div>
{% endblock %}
