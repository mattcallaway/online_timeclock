{% extends "base.html" %}
{% block title %}{{ 'Edit' if user else 'New' }} User{% endblock %}
{% block content %}
<div style="max-width:480px;">
  <div class="page-header">
    <h1>{{ 'Edit User' if user else 'Create New User' }}</h1>
  </div>
  <div class="card">
    <form method="POST">
      {% if not user %}
      <div class="form-group">
        <label>Username *</label>
        <input type="text" name="username" required>
      </div>
      {% else %}
      <div class="form-group">
        <label>Username</label>
        <input type="text" value="{{ user.username }}" disabled style="background:#f1f5f9;">
      </div>
      {% endif %}
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" name="full_name" value="{{ user.full_name if user else '' }}" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" value="{{ user.email or '' if user else '' }}">
      </div>
      <div class="form-group">
        <label>Role *</label>
        <select name="role" {% if user and user.id == current_user.id %}disabled{% endif %}>
          <option value="employee" {% if not user or user.role == 'employee' %}selected{% endif %}>Employee</option>
          <option value="admin" {% if user and user.role == 'admin' %}selected{% endif %}>Admin</option>
        </select>
      </div>
      {% if not user %}
      <div class="form-group">
        <label>Password * <span class="help-text" style="display:inline;">(min. 8 chars)</span></label>
        <input type="password" name="password" required minlength="8">
      </div>
      {% endif %}
      <div style="display:flex;gap:.75rem;">
        <button type="submit" class="btn btn-primary">{{ 'Save Changes' if user else 'Create User' }}</button>
        <a href="{{ url_for('admin.user_list') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
