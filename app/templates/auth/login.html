{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div style="max-width:380px;margin:4rem auto;">
  <div class="card">
    <div style="text-align:center;margin-bottom:1.5rem;">
      <div style="font-size:2rem;">⏱</div>
      <h1 style="font-size:1.4rem;margin-top:.5rem;">Employee TimeClock</h1>
      <p style="color:var(--text-muted);font-size:.875rem;margin-top:.25rem;">Sign in to your account</p>
    </div>
    <form method="POST">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <div class="form-group" style="display:flex;align-items:center;gap:.5rem;">
        <input type="checkbox" id="remember" name="remember" style="width:auto;">
        <label for="remember" style="margin:0;font-weight:normal;">Remember me for 30 days</label>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
    </form>
  </div>
</div>
{% endblock %}
