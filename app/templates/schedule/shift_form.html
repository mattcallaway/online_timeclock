{% extends "base.html" %}
{% block title %}{{ 'Edit' if shift else 'Add' }} Shift{% endblock %}
{% block content %}
<div style="max-width:480px;">
  <div class="page-header"><h1>{{ 'Edit Shift' if shift else 'Add Shift' }}</h1></div>
  <div class="card">
    <form method="POST">
      <div class="form-group">
        <label>Employee *</label>
        <select name="user_id" required>
          <option value="">— Select —</option>
          {% for emp in employees %}
          <option value="{{ emp.id }}" {% if shift and shift.user_id == emp.id %}selected{% endif %}>{{ emp.full_name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Shift Start *</label>
        <input type="datetime-local" name="shift_start" required
               value="{{ shift.shift_start.strftime('%Y-%m-%dT%H:%M') if shift else '' }}">
      </div>
      <div class="form-group">
        <label>Shift End *</label>
        <input type="datetime-local" name="shift_end" required
               value="{{ shift.shift_end.strftime('%Y-%m-%dT%H:%M') if shift else '' }}">
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea name="notes">{{ shift.notes or '' if shift else '' }}</textarea>
      </div>
      <div style="display:flex;gap:.75rem;">
        <button type="submit" class="btn btn-primary">{{ 'Save Changes' if shift else 'Create Shift' }}</button>
        <a href="{{ url_for('schedule.view_schedule') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
